services:

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: rag_qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      # Bound to loopback only — the app connects from the same host via
      # localhost, so this doesn't need (and shouldn't have) LAN/VPN
      # reachability. Publishing this on 0.0.0.0 used to let anyone who
      # could reach the host read or delete every chunk with no auth at
      # all (Qdrant had no API key configured either).
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  postgres:
    image: postgres:15.18-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only — see qdrant's port comment above. Credentials also
      # moved here from a hardcoded literal, since this file is tracked in
      # git (unlike .env).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2.95.11
    container_name: rag_langfuse
    ports:
      # Loopback only — see qdrant's port comment above.
      - "127.0.0.1:3000:3000"
    environment:
      # postgres is reached via the internal Docker network (service name
      # as hostname), not the published/loopback port above.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      SALT: ${LANGFUSE_SALT}
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
